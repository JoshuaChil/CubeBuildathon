[project]
name = "roadimu"
version = "0.1.0"
description = "Simulate bike/car IMU data over real road surfaces and reconstruct road topography from it"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["roadimu", "roadimu.topo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
