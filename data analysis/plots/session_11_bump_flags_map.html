/* Layout: full-height map with a compact instrument strip on top; chrome stays quiet so the imagery carries the page. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --fg:#1d1b17; --muted:#6b665c; --line:#d9d4ca;
  --accent:#d97706; --ring:#ffffff;
  --seq-lo:#fde68a; --seq-hi:#9a3412; --flag:#e11d2e; --ok:#22c55e; --route:rgba(255,255,255,.85);
  --font-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1e2126; --fg:#ecebe6; --muted:#9a9790; --line:#33373d; --accent:#f59e0b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2126; --fg:#ecebe6; --muted:#9a9790; --line:#33373d; --accent:#f59e0b; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);display:flex;flex-direction:column;min-height:100%}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px;padding-block:12px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:500;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-left:auto}
.legend .bar{width:96px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--seq-lo),var(--seq-hi));border:1px solid var(--line)}
.legend .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ring);box-sizing:border-box;box-shadow:0 0 0 1px var(--line)}
.legend .sw.ok{background:var(--ok)}
.legend .sw.flag{background:var(--flag);margin-left:10px}
.legend b{color:var(--fg);font-weight:500;font-family:var(--font-mono)}
#map{flex:1;min-height:420px;background:#0b0f14}
.leaflet-container{font-family:var(--font-body)}
.leaflet-tooltip.pt{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;
  font-size:12px;line-height:1.35;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.leaflet-tooltip.pt .k{color:var(--muted)}
.leaflet-tooltip.pt .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.leaflet-tooltip-top.pt:before{border-top-color:var(--line)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bar a{color:#1d1b17}
@media (max-width:560px){.legend{margin-left:0}}

const ROWS=11327;
const blank="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
const Embedded=L.TileLayer.extend({getTileUrl(c){return TILES[`${c.z}/${c.x}/${c.y}`]||blank}});
const lats=PTS.map(p=>p.lat),lons=PTS.map(p=>p.lon);
const bounds=L.latLngBounds([Math.min(...lats),Math.min(...lons)],[Math.max(...lats),Math.max(...lons)]);
const map=L.map('map',{minZoom:16,maxZoom:18,maxBounds:bounds.pad(0.6),maxBoundsViscosity:0.8,zoomSnap:1});
new Embedded('',{maxZoom:18,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(map);
map.fitBounds(bounds.pad(0.08));
L.polyline(PTS.map(p=>[p.lat,p.lon]),{color:'rgba(255,255,255,.85)',weight:2,opacity:.9,interactive:false}).addTo(map);
// Colour comes only from the app's manual flag (anomaly_detected): green normal, red where the bump button was held.
const OK='#22c55e', FLAG='#e11d2e';
const fmt=d=>new Date(d).toLocaleTimeString([],{hour12:false});
let nFlag=0;
PTS.forEach(p=>{
  const flagged=p.anom===1; if(flagged) nFlag++;
  const m=L.circleMarker([p.lat,p.lon],{radius:flagged?8:4.5,fillColor:flagged?FLAG:OK,fillOpacity:1,color:'#fff',weight:flagged?2.5:1.5}).addTo(map);
  m.bindTooltip(`<div><span class="k">t+</span><span class="v">${p.s}s</span> <span class="k">·</span> <span class="v">${fmt(p.t)}</span>${flagged?' <b style="color:#e11d2e">pothole / bump flagged</b>':''}</div>
  <div><span class="v">${p.n}</span> <span class="k">readings this second</span></div>
  <div class="v">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>`,{className:'pt',direction:'top',offset:[0,-4],sticky:true});
  if(flagged) m.bringToFront();
});
const first=PTS[0],last=PTS[PTS.length-1];
const label=(p,txt)=>L.marker([p.lat,p.lon],{interactive:false,icon:L.divIcon({className:'',html:`<div style="font:500 11px/1 ${getComputedStyle(document.documentElement).getPropertyValue('--font-mono')};color:#fff;text-shadow:0 0 3px #000,0 0 6px #000;white-space:nowrap;transform:translate(10px,-6px)">${txt}</div>`,iconSize:[0,0]})}).addTo(map);
label(first,'start '+fmt(first.t)); label(last,'end '+fmt(last.t));
const dur=last.s-first.s;
document.getElementById('st-pts').textContent=PTS.length;
document.getElementById('st-dur').textContent=`${Math.floor(dur/60)}m ${String(dur%60).padStart(2,'0')}s`;
document.getElementById('st-rows').textContent=ROWS.toLocaleString();
document.getElementById('st-hz').textContent=(ROWS/dur).toFixed(0);
document.getElementById('lg-n').textContent=nFlag;
</script>
